<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="apple-touch-icon" href="icon-180.png">
<title>가계부</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

  :root {
    --paper: #f2ede1;
    --paper-line: #d8cfba;
    --ink: #1e2a3c;
    --ink-soft: #5c6478;
    --stamp-red: #a7333f;
    --stamp-teal: #2f6f62;
    --stamp-gold: #a8781f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0; padding: 0;
    position: fixed; inset: 0; overflow: hidden;
    font-family: 'IBM Plex Sans KR', sans-serif;
    overscroll-behavior: none;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    transition: background 0.5s ease, color 0.5s ease;
  }

  /* ---------- balance theme states (applied to body) ---------- */
  body.theme-warn   { background: #e3b23c; color: #241d0a; }
  body.theme-danger { background: #b0453f; color: #fdf6ec; }
  body.theme-zero    { background: #14181f; color: #f2ede1; }
  body.theme-negative{ background: #0d0f14; color: #ff8080; }

  body.theme-warn .card, body.theme-danger .card, body.theme-zero .card, body.theme-negative .card {
    background: rgba(255,255,255,0.9); color: var(--ink);
  }
  body.theme-danger .icon-btn, body.theme-zero .icon-btn, body.theme-negative .icon-btn {
    background: rgba(255,255,255,0.15); color: inherit; border-color: rgba(255,255,255,0.25);
  }

  #app {
    max-width: 480px; margin: 0 auto; height: 100%;
    padding: calc(env(safe-area-inset-top) + 16px) 0 0;
    position: relative;
    display: flex; flex-direction: column;
  }

  /* ---------- global topbar ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 0 18px; margin-bottom: 4px; }
  .topbar .title { font-size: 13px; letter-spacing: 0.2em; font-weight: 600; opacity: 0.85; }
  .topbar .title span { color: var(--stamp-red); }
  .topbar .icons { display: flex; gap: 8px; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: #fff; border: 1px solid var(--paper-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; color: var(--ink);
  }
  .icon-btn.active { outline: 2px solid var(--stamp-red); }

  .dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.25; }
  .dot.active { opacity: 0.9; }

  /* ---------- swiper ---------- */
  .viewport { overflow: hidden; width: 100%; flex: 1 1 auto; min-height: 0; }
  .swiper { display: flex; height: 100%; transition: transform 0.3s cubic-bezier(.2,.7,.3,1); }
  .page {
    flex: 0 0 100%; width: 100%; height: 100%;
    padding: 8px 18px calc(env(safe-area-inset-bottom) + 110px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  /* ---------- main page ---------- */
  .today-label { font-size: 11px; opacity: 0.75; letter-spacing: 0.1em; margin-top: 22px; }
  .today-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 44px; font-weight: 700;
    margin: 6px 0 6px; word-break: keep-all;
  }
  .avg-line {
    font-size: 12px; opacity: 0.7; margin-bottom: 18px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .card {
    background: #fff; border: 1px solid var(--paper-line); border-radius: 6px;
    margin-bottom: 12px; overflow: hidden; color: var(--ink);
  }
  .mini-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 12px 14px;
    border-bottom: 1px solid var(--paper-line);
  }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .v { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .mini-row .v.red { color: var(--stamp-red); }
  .mini-row .v.teal { color: var(--stamp-teal); }

  /* ---------- add-expense button (softened) ---------- */
  .bottom-bar {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 50%; transform: translateX(-50%);
    max-width: 480px; width: calc(100% - 36px);
    display: flex; gap: 8px; z-index: 30;
  }
  .add-btn {
    flex: 1 1 0;
    background: rgba(255,255,255,0.75); color: var(--ink-soft);
    border: 1.5px solid var(--paper-line);
    border-radius: 24px; padding: 13px; font-size: 13.5px; font-weight: 600;
    backdrop-filter: blur(4px);
  }

  /* ---------- toss paste sheet ---------- */
  .paste-area {
    width: 100%; min-height: 120px; padding: 10px 12px; font-size: 12.5px;
    border: 1px solid var(--paper-line); border-radius: 6px; background: #fff;
    color: var(--ink); font-family: inherit; resize: vertical;
  }
  .modal-sheet.tall { max-height: 88vh; overflow-y: auto; }
  .imp-row {
    background: #fff; border: 1px solid var(--paper-line); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px;
  }
  .imp-row.off { opacity: 0.45; }
  .imp-row.ask { border-color: var(--stamp-gold); border-width: 1.5px; }
  .imp-top { display: flex; align-items: center; gap: 8px; }
  .imp-top input[type=checkbox] { width: 20px; height: 20px; flex: none; }
  .imp-top .m { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-top .a { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--stamp-red); }
  .imp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .imp-grid input, .imp-grid select {
    width: 100%; padding: 7px 6px; border: 1px solid var(--paper-line); border-radius: 5px;
    font-size: 12px; background: #fff; color: var(--ink); font-family: inherit; min-width: 0;
  }
  .imp-note { font-size: 11px; color: var(--stamp-gold); margin-top: 6px; }
  .imp-q { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .imp-q .chip { padding: 7px 11px; font-size: 11.5px; }
  .imp-summary { font-size: 11.5px; opacity: 0.7; margin: 4px 0 12px; line-height: 1.6; }

  /* ---------- ledger page ---------- */
  .summary-strip {
    display: flex; justify-content: space-between;
    background: #fff; border: 1px solid var(--paper-line); border-radius: 6px;
    padding: 12px 14px; margin: 14px 0; font-size: 11px; color: var(--ink);
  }
  .month-nav {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
  }
  .month-nav #viewMonthLabel { font-weight: 700; font-size: 15px; min-width: 70px; text-align: center; }
  .nav-arrow {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: 1px solid var(--paper-line);
    font-size: 20px; color: var(--ink); line-height: 1;
  }
  .nav-arrow:disabled { opacity: 0.3; }
  .past-note { font-size: 10.5px; opacity: 0.65; margin: -6px 0 10px; }
  .summary-strip .v { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; display: block; margin-top: 2px; }
  .ledger-date-head {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace; opacity: 0.6;
    padding: 10px 2px 4px;
  }
  .ledger-row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 11px 12px; background: #fff; border: 1px solid var(--paper-line);
    border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink);
  }
  .ledger-row .tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .ledger-row .tag {
    font-size: 9px; color: var(--stamp-gold); border: 1px solid var(--stamp-gold);
    border-radius: 10px; padding: 1px 6px; width: fit-content;
  }
  .ledger-row .tag.pay { color: var(--stamp-teal); border-color: var(--stamp-teal); }
  .ledger-row .amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--stamp-red); }
  .ledger-row .del { color: var(--ink-soft); font-size: 16px; padding: 0 4px; }
  .empty-note { text-align: center; opacity: 0.6; font-size: 12px; padding: 40px 0; }

  /* ---------- settings page ---------- */
  .page h2 { font-size: 17px; margin: 14px 0 2px; }
  .page .desc { font-size: 12px; opacity: 0.7; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; opacity: 0.75; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--paper-line);
    border-radius: 6px; font-size: 14px; background: #fff; font-family: inherit; color: var(--ink);
  }
  .field input[type=number] { font-family: 'IBM Plex Mono', monospace; }
  .fixed-item {
    display: grid; grid-template-columns: 1fr 100px 30px; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .fixed-item input { padding: 10px; border: 1px solid var(--paper-line); border-radius: 6px; font-size: 13px; background:#fff; color: var(--ink); }
  .fixed-item input[name=amt] { font-family: 'IBM Plex Mono', monospace; text-align: right; }
  .fixed-item .del { text-align: center; opacity: 0.6; }
  .add-fixed-btn {
    width: 100%; padding: 10px; border: 1px dashed var(--paper-line); border-radius: 6px;
    background: transparent; color: var(--ink-soft); font-size: 12px; margin-bottom: 18px;
  }
  .category-item {
    display: grid; grid-template-columns: minmax(0,1fr) 104px 72px 30px; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .category-item input {
    min-width: 0; padding: 10px; border: 1px solid var(--paper-line); border-radius: 6px; font-size: 13px; background:#fff; color: var(--ink);
  }
  .category-item input[name=catBudget] { text-align:right; font-family:'IBM Plex Mono', monospace; }
  .category-item .del { text-align: center; opacity: 0.6; }
  .cat-order-wrap { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .cat-order-btn {
    height:38px; border-radius:6px; border:1px solid var(--paper-line); background:#fff; color:var(--ink);
    font-size:16px; line-height:1; padding:0;
  }
  .cat-order-btn:disabled { opacity:.28; }
  .settings-section-label { display:block; font-size:11px; opacity:.75; margin: 4px 0 8px; }
  .settings-overview-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .overview-box { background:#fff; border:1px solid var(--paper-line); border-radius:6px; padding:12px; color:var(--ink); }
  .overview-box .k { font-size:10px; opacity:.65; margin-bottom:4px; }
  .overview-box .v { font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; }
  .variable-stat { padding:12px 14px; border-bottom:1px solid var(--paper-line); }
  .variable-stat:last-child { border-bottom:none; }
  .variable-stat-head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:8px; }
  .variable-stat-head b { font-size:13px; }
  .variable-stat-head .budget { font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--stamp-teal); }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .stat-cell { background:rgba(242,237,225,.55); border-radius:5px; padding:7px 6px; min-width:0; }
  .stat-cell .k { display:block; font-size:9px; opacity:.62; margin-bottom:3px; white-space:nowrap; }
  .stat-cell .v { display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .btn { padding: 13px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; width: 100%; }
  .modal-actions .btn { width: auto; flex: 1 1 0; min-width: 0; }
  .modal-actions #mDelete { flex: 0 0 auto; padding-left: 16px; padding-right: 16px; }
  .btn-primary { background: var(--ink); color: #fff; }

  /* ---------- modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,24,31,0.45);
    display: flex; align-items: flex-end; z-index: 50;
  }
  .modal-sheet {
    background: var(--paper); width: 100%; max-width: 480px; margin: 0 auto;
    border-radius: 16px 16px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom) + 20px);
    color: var(--ink);
  }
  .modal-sheet h3 { margin: 0 0 14px; font-size: 15px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 18px; border: 1px solid var(--paper-line);
    background: #fff; font-size: 12.5px; color: var(--ink-soft);
  }
  .chip.selected { background: var(--ink); color: #fff; border-color: var(--ink); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--paper-line); }

  /* ---------- negative pulse overlay ---------- */
  #pulseOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 80;
    display: none;
  }
  #pulseOverlay.on { display: block; animation: borderPulse 1.6s ease-in-out infinite; }
  @keyframes borderPulse {
    0%, 100% { box-shadow: inset 0 0 0 5px rgba(255,90,90,0.12); }
    50%      { box-shadow: inset 0 0 0 5px rgba(255,90,90,0.95); }
  }
</style>
</head>
<body>
<div id="pulseOverlay"></div>
<div id="app">

  <div class="topbar">
    <div class="title">가 계 부 <span id="monthLabel"></span></div>
    <div class="icons">
      <button class="icon-btn" id="calendarBtn" title="지출 내역">☰</button>
      <button class="icon-btn" id="settingsBtn" title="설정">⚙️</button>
    </div>
  </div>
  <div class="dots">
    <div class="dot active" data-p="0"></div>
    <div class="dot" data-p="1"></div>
    <div class="dot" data-p="2"></div>
  </div>

  <div class="viewport">
    <div class="swiper" id="swiper">

      <!-- ===== PAGE 0: MAIN ===== -->
      <div class="page" id="page-main">
        <div class="today-label">오늘 쓸 수 있는 돈</div>
        <div class="today-amount" id="todayAmount">0원</div>
        <div class="avg-line" id="avgLine"></div>
        <div class="card">
          <div class="mini-row"><span>고정비 지출</span><span class="v red" id="fixedTotalRow">0원</span></div>
          <div class="mini-row"><span>고정비 차감 후 잔액</span><span class="v" id="afterFixed">0원</span></div>
          <div class="mini-row"><span>어제 지출</span><span class="v" id="yesterdaySpent">0원</span></div>
          <div class="mini-row"><span>남은 일수</span><span class="v" id="daysLeft">0일</span></div>
          <div class="mini-row"><span>현재 잔액</span><span class="v teal" id="currentBalance">0원</span></div>
        </div>
      </div>

      <!-- ===== PAGE 1: LEDGER ===== -->
      <div class="page" id="page-ledger">
        <div class="month-nav">
          <button class="nav-arrow" id="prevMonthBtn">‹</button>
          <div id="viewMonthLabel"></div>
          <button class="nav-arrow" id="nextMonthBtn">›</button>
          <button class="chip" id="todayBtn" style="margin-left:auto;">오늘</button>
        </div>
        <div class="summary-strip">
          <div>고정비 차감 후<span class="v" id="ledgerAfterFixed">0원</span></div>
          <div>현재 잔액<span class="v" id="ledgerBalance">0원</span></div>
        </div>
        <div id="ledgerList"></div>
      </div>

      <!-- ===== PAGE 2: SETTINGS ===== -->
      <div class="page" id="page-settings">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2>예산 / 지출 설정</h2>
          <button class="chip" id="editToggleBtn" style="flex:none;">편집</button>
        </div>
        <div class="desc">편집 버튼을 누르면 수정할 수 있어요.</div>

        <div id="settingsView"></div>

        <div id="settingsEdit" class="hidden">
          <div class="field">
            <label>월 예산</label>
            <input type="number" id="setupBudget" placeholder="1000000">
          </div>
          <label class="settings-section-label">고정비</label>
          <div id="fixedList"></div>
          <button class="add-fixed-btn" id="addFixedBtn">+ 고정비 항목 추가</button>

          <label class="settings-section-label">변동비</label>
          <div id="categoryList"></div>
          <button class="add-fixed-btn" id="addCategoryBtn">+ 변동비 분류 추가</button>

          <button class="btn btn-primary" id="saveSetupBtn">저장하기</button>
        </div>
        <div style="text-align:center;font-size:10px;opacity:.5;margin-top:14px;font-family:'IBM Plex Mono',monospace;">v2.6</div>
      </div>

    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button class="add-btn" id="addExpenseBtn">+ 지출 입력</button>
    <button class="add-btn" id="pasteBtn">📷 토스 가져오기</button>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const DEFAULT_CATS = ['식비','교통','생활','미용','기타'];
  const PAYS = ['현금','신한카드','국민카드','현대카드'];
  const localDateStr = d => {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const monthKey = () => localDateStr(new Date()).slice(0,7);
  const todayKey = () => localDateStr(new Date());

  const defaultFixedItems = [
    {name:'월세', amt:150000},
    {name:'수도세', amt:50000},
    {name:'유튜브', amt:30000},
    {name:'넷플릭스', amt:30000},
    {name:'통신비(SKT)', amt:100000},
    {name:'가스비', amt:50000},
    {name:'전기세', amt:30000},
    {name:'교통', amt:100000},
    {name:'미용비', amt:50000},
  ];

  function normalizeConfig(cfg){
    const out = cfg || {};
    if(!Number.isFinite(Number(out.budget))) out.budget = 1000000;
    out.budget = Number(out.budget) || 0;
    if(!Array.isArray(out.fixedItems)) out.fixedItems = JSON.parse(JSON.stringify(defaultFixedItems));
    if(!Array.isArray(out.cats) || out.cats.length === 0) out.cats = [...DEFAULT_CATS];
    out.cats = [...new Set(out.cats.map(c => String(c || '').trim()).filter(Boolean))];
    if(out.cats.length === 0) out.cats = ['기타'];
    if(!out.catBudgets || typeof out.catBudgets !== 'object' || Array.isArray(out.catBudgets)) out.catBudgets = {};
    const cleanBudgets = {};
    out.cats.forEach(cat => { cleanBudgets[cat] = Math.max(0, Number(out.catBudgets[cat]) || 0); });
    out.catBudgets = cleanBudgets;
    return out;
  }
  function loadConfig(){
    const key = 'gb_config_' + monthKey();
    const raw = localStorage.getItem(key);
    if(raw){
      const cfg = normalizeConfig(JSON.parse(raw));
      localStorage.setItem(key, JSON.stringify(cfg));
      return cfg;
    }
    // 이번 달 설정이 없으면 가장 최근 달의 설정을 이어받음
    const prevKeys = Object.keys(localStorage)
      .filter(k => k.startsWith('gb_config_'))
      .sort();
    let def;
    if(prevKeys.length > 0){
      def = normalizeConfig(JSON.parse(localStorage.getItem(prevKeys[prevKeys.length - 1])));
    } else {
      def = { budget: 1000000, fixedItems: JSON.parse(JSON.stringify(defaultFixedItems)), cats: [...DEFAULT_CATS], catBudgets: {} };
    }
    localStorage.setItem(key, JSON.stringify(def));
    return def;
  }
  function saveConfig(cfg){ localStorage.setItem('gb_config_' + monthKey(), JSON.stringify(normalizeConfig(cfg))); }
  function loadExpenses(month = monthKey()){
    const raw = localStorage.getItem('gb_expenses_' + month);
    return raw ? JSON.parse(raw) : [];
  }
  function saveExpenses(list, month = monthKey()){
    localStorage.setItem('gb_expenses_' + month, JSON.stringify(list));
  }

  // 예전 버전에서 다른 달 날짜가 현재 달 저장공간에 들어간 기록을 자동 정리
  function repairExpenseMonthBuckets(){
    const prefix = 'gb_expenses_';
    const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
    if(keys.length === 0) return;

    const buckets = {};
    const seen = new Set();
    let changed = false;

    keys.forEach(key => {
      const storedMonth = key.slice(prefix.length);
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key)) || []; }
      catch(e) { return; }

      list.forEach(exp => {
        const dateMonth = typeof exp.date === 'string' ? exp.date.slice(0, 7) : '';
        const targetMonth = /^\d{4}-\d{2}$/.test(dateMonth) ? dateMonth : storedMonth;
        if(targetMonth !== storedMonth) changed = true;

        const dedupeKey = String(exp.id) + '|' + targetMonth;
        if(seen.has(dedupeKey)) return;
        seen.add(dedupeKey);
        (buckets[targetMonth] ||= []).push(exp);
      });
    });

    if(!changed) return;

    keys.forEach(key => localStorage.removeItem(key));
    Object.entries(buckets).forEach(([month, list]) => saveExpenses(list, month));
  }

  function fmt(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function esc(v){
    return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function allExpenseMonthsBefore(targetMonth = monthKey()){
    return Object.keys(localStorage)
      .filter(k => /^gb_expenses_\d{4}-\d{2}$/.test(k))
      .map(k => k.slice('gb_expenses_'.length))
      .filter(m => m < targetMonth)
      .sort();
  }
  function sumExpenses(list, cat = null){
    return list.filter(e => !cat || e.cat === cat).reduce((s,e)=>s + (Number(e.amt)||0), 0);
  }
  function variableStats(cfg){
    const currentMonth = monthKey();
    const prevMonth = shiftMonth(currentMonth, -1);
    const current = loadExpenses(currentMonth);
    const prev = loadExpenses(prevMonth);
    const historyMonths = allExpenseMonthsBefore(currentMonth);
    const historyLists = historyMonths.map(m => loadExpenses(m));
    const avgFor = cat => historyLists.length
      ? historyLists.reduce((s,list)=>s + sumExpenses(list, cat), 0) / historyLists.length
      : 0;
    const byCat = {};
    cfg.cats.forEach(cat => {
      byCat[cat] = {
        budget: Number(cfg.catBudgets?.[cat]) || 0,
        current: sumExpenses(current, cat),
        prev: sumExpenses(prev, cat),
        avg: avgFor(cat)
      };
    });
    return {
      total: {
        budget: cfg.cats.reduce((s,cat)=>s + (Number(cfg.catBudgets?.[cat])||0), 0),
        current: sumExpenses(current),
        prev: sumExpenses(prev),
        avg: avgFor(null)
      },
      byCat,
      historyCount: historyLists.length
    };
  }

  function daysInMonth(){
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  }
  function daysRemainingIncludingToday(){
    const d = new Date();
    return daysInMonth() - d.getDate() + 1;
  }

  /* ---------- balance theme ---------- */
  function applyTheme(balance){
    document.body.classList.remove('theme-warn','theme-danger','theme-zero','theme-negative');
    $('pulseOverlay').classList.remove('on');
    if(balance < 0){
      document.body.classList.add('theme-negative');
      $('pulseOverlay').classList.add('on');
    } else if(balance === 0){
      document.body.classList.add('theme-zero');
    } else if(balance <= 50000){
      document.body.classList.add('theme-danger');
    } else if(balance <= 100000){
      document.body.classList.add('theme-warn');
    }
  }

  /* ---------- render: main ---------- */
  function renderMain(){
    const cfg = loadConfig();
    const expenses = loadExpenses();
    const fixedTotal = cfg.fixedItems.reduce((s,i)=>s+i.amt,0);
    const spentTotal = expenses.reduce((s,e)=>s+e.amt,0);
    const balance = cfg.budget - fixedTotal - spentTotal;
    const afterFixed = cfg.budget - fixedTotal;

    const yestKey = localDateStr(new Date(Date.now() - 86400000));
    const yestSpent = expenses.filter(e=>e.date===yestKey).reduce((s,e)=>s+e.amt,0);

    const daysLeft = daysRemainingIncludingToday();
    const dailyAllowance = balance / Math.max(daysLeft,1);

    $('monthLabel').textContent = '· ' + (new Date().getMonth()+1) + '월';
    $('todayAmount').textContent = fmt(dailyAllowance);
    $('yesterdaySpent').textContent = '-' + fmt(yestSpent);
    $('daysLeft').textContent = daysLeft + '일';
    $('afterFixed').textContent = fmt(afterFixed);
    $('currentBalance').textContent = fmt(balance);
    $('fixedTotalRow').textContent = '-' + fmt(fixedTotal);

    const prevM = shiftMonth(monthKey(), -1);
    const prevRaw = localStorage.getItem('gb_expenses_' + prevM);
    if(prevRaw && JSON.parse(prevRaw).length > 0){
      const prevSpent = JSON.parse(prevRaw).reduce((s,e)=>s+e.amt,0);
      const [py, pm] = prevM.split('-').map(Number);
      const prevDays = new Date(py, pm, 0).getDate();
      $('avgLine').textContent = '지난달 하루 평균 ' + fmt(prevSpent / prevDays);
    } else {
      const elapsedDays = new Date().getDate();
      $('avgLine').textContent = '이번 달 하루 평균 ' + fmt(spentTotal / elapsedDays);
    }

    applyTheme(balance);
  }

  /* ---------- render: ledger ---------- */
  let viewMonth = monthKey();
  function shiftMonth(m, delta){
    let [y, mm] = m.split('-').map(Number);
    mm += delta;
    while(mm < 1){ mm += 12; y--; }
    while(mm > 12){ mm -= 12; y++; }
    return `${y}-${String(mm).padStart(2,'0')}`;
  }
  function renderLedger(){
    const isCurrent = viewMonth === monthKey();
    const cfgRaw = localStorage.getItem('gb_config_' + viewMonth);
    const cfg = cfgRaw ? JSON.parse(cfgRaw) : loadConfig();
    const expRaw = localStorage.getItem('gb_expenses_' + viewMonth);
    const expenses = (expRaw ? JSON.parse(expRaw) : []).slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);

    const [vy, vm] = viewMonth.split('-').map(Number);
    const thisYear = new Date().getFullYear();
    $('viewMonthLabel').textContent = (vy !== thisYear ? vy + '년 ' : '') + vm + '월';
    $('nextMonthBtn').disabled = false;
    $('todayBtn').style.visibility = isCurrent ? 'hidden' : 'visible';

        lastDate = e.date;

      html += `
        <div class="ledger-row" data-edit="${e.id}">
          <span>${e.memo || e.cat}
            <div class="tags"><span class="tag">${e.cat}</span><span class="tag pay">${e.pay}</span></div>
          </span>
          <span class="amt"${e.amt < 0 ? ' style="color:var(--stamp-teal)"' : ''}>${e.amt < 0 ? '+' + (-e.amt).toLocaleString('ko-KR') : '-' + e.amt.toLocaleString('ko-KR')}</span>
        </div>`;
    });
    $('ledgerList').innerHTML = html;
    $('ledgerList').querySelectorAll('[data-edit]').forEach(row=>{
      row.onclick = () => {

  $('prevMonthBtn').onclick = () => { viewMonth = shiftMonth(viewMonth, -1); renderLedger(); };
  $('nextMonthBtn').onclick = () => {

  function renderSettingsView(){
    const cfg = loadConfig();

    $('settingsView').innerHTML = `
      <div class="card">

        <div class="overview-box"><div class="k">고정비</div><div class="v">${fmt(fixedTotal)}</div></div>

      <div class="card">
        <div class="mini-row"><span><b>고정비</b></span><span class="v red">-${fmt(fixedTotal)}</span></div>

      </div>

        <div class="variable-stat">

          ${statCells(stats.total)}
        </div>
        ${cfg.cats.map(cat => {
          const st = stats.byCat[cat];
          return `<div class="variable-stat">
            <div class="variable-stat-head"><b>${esc(cat)}</b><span class="budget">예산 ${fmt(st.budget)}</span></div>
            ${statCells(st)}

  let settingsEditing = false;
  function setSettingsMode(editing){
    settingsEditing = editing;
    $('settingsView').classList.toggle('hidden', editing);
    $('settingsEdit').classList.toggle('hidden', !editing);
    $('editToggleBtn').textContent = editing ? '취소' : '편집';
    $('editToggleBtn').classList.toggle('selected', editing);

  }
  $('editToggleBtn').onclick = () => setSettingsMode(!settingsEditing);
  function renderSettingsEdit(){
    const cfg = loadConfig();
    currentFixedItems = JSON.parse(JSON.stringify(cfg.fixedItems));
    currentVariableItems = cfg.cats.map(name => ({ name, budget: Number(cfg.catBudgets?.[name]) || 0 }));

  $('addFixedBtn').onclick = () => {
    syncFixedFromDOM();
    currentFixedItems.push({name:'', amt:0});
    renderFixedList(currentFixedItems);
  };
  $('addCategoryBtn').onclick = () => {
    syncCategoriesFromDOM();
    currentVariableItems.push({name:'', budget:0});
    renderCategoryList(currentVariableItems);
    const inputs = $('categoryList').querySelectorAll('[name=catName]');
    if(inputs.length) inputs[inputs.length - 1].focus();

  $('saveSetupBtn').onclick = () => {
    const rows = $('fixedList').querySelectorAll('.fixed-item');
    const items = Array.from(rows).map(r => ({
      name: r.querySelector('[name=name]').value.trim() || '항목',
      amt: parseInt(r.querySelector('[name=amt]').value) || 0
    }));
    const budget = parseInt($('setupBudget').value) || 0;
    syncCategoriesFromDOM();
    const unique = [];
    const seen = new Set();
    currentVariableItems.forEach(it => {
      if(!it.name || seen.has(it.name)) return;
      seen.add(it.name);
      unique.push(it);
    });
    if(unique.length === 0) unique.push({name:'기타', budget:0});
    const cats = unique.map(it => it.name);
    const catBudgets = Object.fromEntries(unique.map(it => [it.name, Math.max(0, Number(it.budget)||0)]));
    saveConfig({ budget, fixedItems: items, cats, catBudgets });

  /* ---------- swiper ---------- */
  let pageIndex = 0;
  function snapToPage(i){
    $('swiper').style.transform = `translateX(-${i * 100}%)`;
    document.querySelectorAll('.dot').forEach((d,idx)=> d.classList.toggle('active', idx===i));
    $('bottomBar').style.display = i === 2 ? 'none' : 'flex';
    $('calendarBtn').classList.toggle('active', i===1);
    $('settingsBtn').classList.toggle('active', i===2);
  }
  function goToPage(i){
    const next = Math.max(0, Math.min(2, i));
    const changed = next !== pageIndex;
    pageIndex = next;
    snapToPage(pageIndex);
    if(changed){
      if(pageIndex===1){ viewMonth = monthKey(); renderLedger(); }
      if(pageIndex===2) setSettingsMode(false);
    }
  }
  $('calendarBtn').onclick = () => goToPage(1);
  $('settingsBtn').onclick = () => goToPage(2);
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => goToPage(parseInt(d.getAttribute('data-p'))));

  const viewport = document.querySelector('.viewport');
  let touchStartX = null, touchStartY = null, touchDeltaX = 0, lockedDir = null;
  viewport.addEventListener('touchstart', e => {
    if(e.target.closest('input, select, button, .chip, .del, .icon-btn')){
      touchStartX = null;
      return;
    }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    lockedDir = null;
  }, {passive:true});
  viewport.addEventListener('touchmove', e => {
    if(touchStartX === null) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if(lockedDir === null){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // 아직 방향 판단 전
      lockedDir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if(lockedDir === 'h') $('swiper').style.transition = 'none';
    }
    if(lockedDir !== 'h') return; // 세로 스크롤 중에는 가로 이동 안 함
    touchDeltaX = dx;
    const base = -pageIndex * viewport.offsetWidth;
    $('swiper').style.transform = `translateX(${base + touchDeltaX}px)`;
  }, {passive:true});
  viewport.addEventListener('touchend', () => {
    if(touchStartX === null) return;
    if(lockedDir === 'h'){
      $('swiper').style.transition = '';
      if(Math.abs(touchDeltaX) > 60){
        goToPage(pageIndex + (touchDeltaX < 0 ? 1 : -1));
      } else {
        snapToPage(pageIndex);
      }
    }
    touchStartX = null; touchStartY = null; touchDeltaX = 0; lockedDir = null;
  });

  /* ---------- add / edit expense modal ---------- */
  function openExpenseModal(existing){
    const cfg = loadConfig();
    const cats = [...cfg.cats];
    if(existing && existing.cat && !cats.includes(existing.cat)) cats.push(existing.cat);
    let selectedCat = existing ? existing.cat : cats[0];
    let selectedPay = existing ? existing.pay : PAYS[0];
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-sheet">
        <h3>${existing ? '지출 수정' : '지출 입력'}</h3>
        <div class="field">
          <label>날짜</label>
          <input type="date" id="mDate" value="${existing ? existing.date : todayKey()}">
        </div>
        <div class="field">
          <label>금액</label>
          <input type="number" id="mAmt" placeholder="0" inputmode="numeric" value="${existing ? existing.amt : ''}">
        </div>
        <div class="field">
          <label>분류</label>
          <div class="chip-row" id="catChips">${cats.map(c=>`<button class="chip${c===selectedCat?' selected':''}" data-c="${c}">${c}</button>`).join('')}</div>
        </div>
        <div class="field">
          <label>결제수단</label>
          <div class="chip-row" id="payChips">${PAYS.map(p=>`<button class="chip${p===selectedPay?' selected':''}" data-p="${p}">${p}</button>`).join('')}</div>
        </div>
        <div class="field">
          <label>메모 (선택)</label>
          <input type="text" id="mMemo" placeholder="예: 편의점" value="${existing ? (existing.memo||'').replace(/"/g,'&quot;') : ''}">
        </div>
        <div class="modal-actions">
          ${existing ? '<button class="btn btn-secondary" id="mDelete" style="color:var(--stamp-red);border-color:var(--stamp-red);">삭제</button>' : ''}
          <button class="btn btn-secondary" id="mCancel">취소</button>
          <button class="btn btn-primary" id="mSave">저장</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    if(!existing) $('mAmt').focus();

    if(existing){
      let armed = false;
      $('mDelete').onclick = () => {
        if(!armed){
          armed = true;
          $('mDelete').textContent = '정말 삭제?';
          return;
        }
        const sourceMonth = existing.date.slice(0, 7);
        saveExpenses(loadExpenses(sourceMonth).filter(x => x.id !== existing.id), sourceMonth);
        backdrop.remove();
        renderMain(); renderLedger();
      };
    }

    backdrop.querySelectorAll('#catChips .chip').forEach(ch => ch.onclick = () => {
      selectedCat = ch.getAttribute('data-c');
      backdrop.querySelectorAll('#catChips .chip').forEach(c=>c.classList.toggle('selected', c===ch));
    });
    backdrop.querySelectorAll('#payChips .chip').forEach(ch => ch.onclick = () => {
      selectedPay = ch.getAttribute('data-p');
      backdrop.querySelectorAll('#payChips .chip').forEach(c=>c.classList.toggle('selected', c===ch));
    });

    $('mCancel').onclick = () => backdrop.remove();
    backdrop.addEventListener('click', e => { if(e.target === backdrop) backdrop.remove(); });

    $('mSave').onclick = () => {
      const amt = parseInt($('mAmt').value);
      if(!amt || amt <= 0) return;
      const date = $('mDate').value || todayKey();
      const targetMonth = date.slice(0, 7);
      const updatedExpense = {
        id: existing ? existing.id : Date.now(),
        date, amt,
        cat: selectedCat,
        pay: selectedPay,
        memo: $('mMemo').value.trim()
      };

      if(existing){
        const sourceMonth = existing.date.slice(0, 7);
        const sourceList = loadExpenses(sourceMonth);
        const idx = sourceList.findIndex(x => x.id === existing.id);

        if(sourceMonth === targetMonth){
          if(idx > -1) sourceList[idx] = { ...sourceList[idx], ...updatedExpense };
          saveExpenses(sourceList, sourceMonth);
        } else {
          if(idx > -1) sourceList.splice(idx, 1);
          saveExpenses(sourceList, sourceMonth);

          const targetList = loadExpenses(targetMonth);
          targetList.push(updatedExpense);
          saveExpenses(targetList, targetMonth);
        }
      } else {
        const targetList = loadExpenses(targetMonth);
        targetList.push(updatedExpense);
        saveExpenses(targetList, targetMonth);
      }
      backdrop.remove();
      renderMain(); renderLedger();
    };
  }

  /* ---------- toss paste import ---------- */
  function cardToPay(card){
    if(/현대/.test(card)) return '현대카드';
    if(/deep\s*dream|신한/i.test(card)) return '신한카드';
    if(/국민|KB|t-?economy/i.test(card)) return '국민카드';
    return null;
  }
  function guessCatRaw(m){
    if(/코스트코|컬리|kurly|마트|편의점|GS25|CU|세븐|이마트|홈플러스|푸르네|카페|커피|스타벅스|바나프레소|메가|컴포즈|빽다방|투썸|이디야|배달|식당/i.test(m)) return '식비';
    if(/다이소|올리브영|쿠팡|생활/i.test(m)) return '생활';
    if(/버스|지하철|택시|교통|코레일/i.test(m)) return '교통';
    if(/미용|헤어|무지|muji/i.test(m)) return '미용';
    return '기타';
  }
  function guessCat(m){
    const cats = loadConfig().cats;
    const g = guessCatRaw(m);
    if(cats.includes(g)) return g;
    return cats.includes('기타') ? '기타' : cats[cats.length - 1];
  }
  function dayToDate(day){
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth() + 1;
    if(day > now.getDate()){ m -= 1; if(m < 1){ m = 12; y -= 1; } } // 오늘보다 큰 날짜는 지난달
    return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function parseToss(text){
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
      // 토스 배너 글자 무시 ("7건 / 캐시백 가능한 내역 / 확인하기" 등)
      .filter(s => !/^확인하기$|캐시백|^\d+건$/.test(s));
    const items = [];
    let curDate = todayKey();
    for(let i = 0; i < lines.length; i++){
      const dm = lines[i].match(/^(\d{1,2})일\s*[월화수목금토일]요일$/);
      if(dm){ curDate = dayToDate(parseInt(dm[1])); continue; }

      const am = lines[i].match(/^-\s?([\d,]+)\s?원$/);
      if(!am) continue;                         // +금액(입금)이나 기타 조각은 무시
      const amt = parseInt(am[1].replace(/,/g,''));
      // 라이브 텍스트가 "|"를 l·I·｜로 읽는 경우 보정
      const next = (lines[i+1] || '').replace(/｜/g,'|').replace(/\s[lI]\s/g,' | ');

      // 계좌에서 나간 것 (화살표)
      if(/->|→/.test(next)){
        i++;
        if(/서울페이/.test(next)){
          items.push({ date: curDate, amt, memo: '서울페이 충전', cat: guessCat('서울페이'), pay: '현금', kind: 'normal' });
        }
        continue;                               // 대출이자·계좌이체·인출은 제외
      }
      if(/인출|대출이자/.test(next)){ i++; continue; }

      if(next.includes('|')){
        i++;
        let parts = next.split('|').map(s => s.trim()).filter(Boolean);
        let cancel = false;
        if(parts[0] === '취소'){ cancel = true; parts = parts.slice(1); }
        const memo = parts[0] || '';
        const pay = cardToPay(parts[1] || '');
        items.push({
          date: curDate, amt, memo, cat: guessCat(memo),
          pay: pay || '현금', kind: cancel ? 'cancel' : 'normal',
          payUnknown: !pay
        });
      } else {
        // 금액만 있고 가맹점 줄이 없음 (예: "확인하기")
        if(next && !/^-?[\d,]+\s?원$/.test(next) && !/일\s*[월화수목금토일]요일$/.test(next)) i++;
        items.push({ date: curDate, amt, memo: '', cat: guessCat(''), pay: '현금', kind: 'unknown' });
      }
    }

    // 토스에서 "취소 |" 건은 그 자체가 이미 취소된 결제 → 그 줄만 빼고 나머지는 그대로 기록
    const pairCount = items.filter(x => x.kind === 'cancel').length;
    return { items: items.filter(x => x.kind !== 'cancel'), pairCount };
  }

  // 정확히 같은 기록, 또는 금액이 같고 날짜가 3일 이내인 기록을 찾음
  function sameAsSaved(it){
    const mk = it.date.slice(0,7);
    const pool = [shiftMonth(mk,-1), mk, shiftMonth(mk,1)].flatMap(m => loadExpenses(m));
    const exact = pool.find(e => e.date === it.date && e.amt === it.amt && (e.memo || '') === it.memo);
    if(exact) return { e: exact, exact: true };
    const t = new Date(it.date + 'T00:00:00').getTime();
    const near = pool.find(e => e.amt === it.amt &&
      Math.abs(new Date(e.date + 'T00:00:00').getTime() - t) <= 3 * 86400000);
    return near ? { e: near, exact: false } : null;
  }

  /* ---------- toss screenshot (OCR) parser ---------- */
  // images: [{ lines: [{y, c, t}] }]  — 위치(y)순으로 정렬해 날짜 머리글을 정확히 붙임
  function ocrCard(card){
    if(/현대|edition|리워드/i.test(card)) return '현대카드';
    if(/dream|platinum|미니언즈|신한/i.test(card)) return '신한카드';
    if(/econom|국민|KB/i.test(card)) return '국민카드';
    return null;
  }
  function ocrAmount(t){
    // 앞쪽 아이콘 잡음은 무시하고 "-금액원" 부분만 찾음 (원이 &, 윈, 워, ¢, %로 읽히는 경우 포함)
    const m = t.match(/-\s?(\d{1,3}(?:[,.]\d{3})+|\d{3,7})\s?(원|윈|워|&|¢|%|%!)?\s*$/);
    if(!m) return null;
    if(!m[2] && !/[,.]/.test(m[1])) return null;   // 쉼표도 "원"도 없으면 금액으로 보기 어려움
    return parseInt(m[1].replace(/[,.]/g,''));
  }
  function ocrDate(monthHint, day){
    const now = new Date();
    let y = now.getFullYear(), m = monthHint || (now.getMonth() + 1);
    if(!monthHint && day > now.getDate()){ m -= 1; }
    if(m > now.getMonth() + 1) y -= 1;               // 지금보다 뒤의 달이면 작년
    if(m < 1){ m = 12; y -= 1; }
    return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + n);
    return localDateStr(d);
  }

  function parseTossImages(images){
    const all = [];
    images.forEach((img, imgIdx) => {
      const lines = img.lines.slice().sort((a,b) => a.y - b.y)
        .map(l => ({ ...l, t: l.t.replace(/｜/g,'|').replace(/\s[lI]\s/g,' | ') }));
      let monthHint = null;
      const mh = lines.slice(0, 4).map(l => l.t.match(/(\d{1,2})\s?월/)).find(Boolean);
      if(mh) monthHint = parseInt(mh[1]);

      const items = [];
      let curDate = null;
      let pendingAmt = null;     // { amt, conf } 아직 가맹점 줄을 못 만난 금액
      const flushUnknown = () => {
        if(pendingAmt) items.push({ amt: pendingAmt.amt, amtCheck: pendingAmt.conf < 70, img: imgIdx,
          date: curDate, dateGuess: !curDate, memo: '', pay: '현금', kind: 'unknown' });
        pendingAmt = null;
      };
      for(const l of lines){
        const dm = l.t.match(/(\d{1,2})일\s*[월화수목금토일]요일/);
        if(dm){ flushUnknown(); curDate = ocrDate(monthHint, parseInt(dm[1])); continue; }

        // 상단 달력의 일별 합계 줄 (금액이 여러 개) 무시
        if((l.t.match(/-\s?\d[\d,.]{2,}/g) || []).length >= 2) continue;
        const amt = ocrAmount(l.t);
        if(amt !== null){ flushUnknown(); pendingAmt = { amt, conf: l.c }; continue; }

        const isTransfer = /계좌|>|→/.test(l.t) && !l.t.includes('|');
        const isMerchant = l.t.includes('|');
        if(!isTransfer && !isMerchant){ continue; }   // 잡음·버튼·배너

        // 취소 줄: 토스에서 줄 그어진 건 = 이미 취소된 결제 → 건너뜀
        if(/취소\s*\|/.test(l.t)){ pendingAmt = null; continue; }
        if(!pendingAmt) continue;                       // 위가 잘려 금액이 없는 줄

        const base = { amt: pendingAmt.amt, amtCheck: pendingAmt.conf < 70, img: imgIdx,
                       date: curDate, dateGuess: !curDate };
        pendingAmt = null;

        if(isTransfer){
          if(/서울페이/.test(l.t)) items.push({ ...base, memo: '서울페이 충전', pay: '현금', kind: 'normal' });
          continue;                                     // 대출이자·이체·인출 제외
        }
        if(/대출이자|인출/.test(l.t)) continue;
        const parts = l.t.split('|').map(s => s.trim());
        const memo = parts[0].replace(/^[^가-힣A-Za-z0-9]+/, '').trim();
        const pay = ocrCard(parts.slice(1).join(' '));
        items.push({ ...base, memo, pay: pay || '현금', payUnknown: !pay, kind: 'normal' });
      }
      flushUnknown();
      // 화면 맨 위(첫 날짜 머리글보다 위)의 건: 첫 머리글 다음 날로 추정
      const firstDate = items.find(it => it.date)?.date || null;
      items.forEach(it => {
        if(!it.date){
          let g = firstDate ? addDays(firstDate, 1) : todayKey();
          if(g > todayKey()) g = todayKey();
          it.date = g;
          it.dateGuess = g !== todayKey();
        }
      });
      all.push(...items);
    });

    // 여러 장에 겹쳐 찍힌 건은 하나만 (같은 날짜·금액, 다른 사진)
    const result = [];
    all.forEach(it => {
      const twin = result.find(r => r.img !== it.img && r.date === it.date && r.amt === it.amt && !r._twin);
      if(twin){
        twin._twin = true;
        if(twin.kind === 'unknown' && it.kind === 'normal'){ Object.assign(twin, { kind: 'normal', memo: it.memo, pay: it.pay, payUnknown: it.payUnknown }); }
        else if(it.kind === 'normal'){
          if(twin.payUnknown && !it.payUnknown){ twin.pay = it.pay; twin.payUnknown = false; }
          if(it.memo.length > twin.memo.length) twin.memo = it.memo;
        }
        if(!it.amtCheck) twin.amtCheck = false;
        if(!it.dateGuess) twin.dateGuess = false;
        return;
      }
      result.push(it);
    });
    result.forEach(it => { it.cat = guessCat(it.memo); delete it._twin; });
    return result;
  }

  let tessLoading = null;
  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(tessLoading) return tessLoading;
    tessLoading = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      sc.onload = res; sc.onerror = () => { tessLoading = null; rej(new Error('글자 인식 도구를 불러오지 못했어요 (인터넷 연결 확인)')); };
      document.head.appendChild(sc);
    });
    return tessLoading;
  }
  // 다크모드 캡처 → 흰 바탕 검은 글씨로 바꿔서 인식률을 높임
  function prepImage(file){
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height); const px = d.data;
        const gray = new Uint8ClampedArray(px.length / 4);
        let sum = 0;
        for(let i = 0, j = 0; i < px.length; i += 4, j++){ const g = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2]; gray[j] = g; sum += g; }
        const dark = sum / gray.length < 128;
        const hist = new Array(256).fill(0); gray.forEach(g => hist[dark ? 255 - g : g]++);
        let lo = 0, hi = 255, acc = 0, cut = gray.length * 0.02;
        for(acc = 0; lo < 255 && (acc += hist[lo]) < cut; lo++);
        for(acc = 0; hi > 0 && (acc += hist[hi]) < cut; hi--);
        const span = Math.max(1, hi - lo);
        for(let i = 0, j = 0; i < px.length; i += 4, j++){
          let g = dark ? 255 - gray[j] : gray[j];
          g = Math.max(0, Math.min(255, (g - lo) * 255 / span));
          px[i] = px[i+1] = px[i+2] = g;
        }
        ctx.putImageData(d, 0, 0);
        URL.revokeObjectURL(img.src);
        res(c);
      };
      img.onerror = () => rej(new Error('사진을 열 수 없어요'));
      img.src = URL.createObjectURL(file);
    });
  }
  async function readTossPhotos(files, setStatus){
    await loadTesseract();
    setStatus('글자 인식 준비 중… (처음 한 번은 오래 걸려요)');
    const worker = await Tesseract.createWorker(['kor','eng'], 1);
    const images = [];
    try {
      for(let i = 0; i < files.length; i++){
        setStatus(`사진 읽는 중… ${i+1} / ${files.length}`);
        const canvas = await prepImage(files[i]);
        const { data } = await worker.recognize(canvas);
        images.push({ lines: data.lines.map(l => ({ y: l.bbox.y0, c: l.confidence, t: l.text.trim() })) });
      }
    } finally { await worker.terminate(); }
    return parseTossImages(images);
  }

  function openPasteSheet(){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-sheet tall">
        <h3>토스 내역 가져오기</h3>
        <div class="imp-summary">토스 소비 내역 캡처를 고르면 날짜·금액·카드를 읽어와요. 여러 장 한 번에 골라도 돼요 (겹친 부분은 한 번만 들어가요).</div>
        <label class="btn btn-primary" style="display:block;text-align:center;">
          📷 캡처 사진 고르기
          <input type="file" id="pFiles" accept="image/*" multiple style="display:none;">
        </label>
        <div class="imp-summary" id="pStatus" style="margin-top:10px;"></div>
        <details style="margin-top:6px;">
          <summary style="font-size:12px;opacity:.7;">글자 복사해서 붙여넣기 (예전 방식)</summary>
          <textarea class="paste-area" id="pText" placeholder="여기에 붙여넣기" style="margin-top:8px;"></textarea>
          <button class="btn btn-secondary" id="pRead" style="margin-top:8px;">읽기</button>
        </details>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="pCancel">닫기</button>
        </div>
        <div id="pResult"></div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', e => { if(e.target === backdrop) backdrop.remove(); });
    $('pCancel').onclick = () => backdrop.remove();

    $('pFiles').onchange = async (e) => {
      const files = [...e.target.files];
      if(!files.length) return;
      const setStatus = t => { const el = $('pStatus'); if(el) el.textContent = t; };
      try {
        const items = await readTossPhotos(files, setStatus);
        setStatus('');
        renderPreview(items, 0, backdrop, true);
      } catch(err){
        setStatus(err.message || '사진을 읽지 못했어요');
      }
      e.target.value = '';
    };
    $('pRead').onclick = () => {
      const { items, pairCount } = parseToss($('pText').value);
      renderPreview(items, pairCount, backdrop, false);
    };
  }

  function renderPreview(items, pairCount, backdrop, fromPhoto){
    const box = $('pResult');
    if(items.length === 0){
      box.innerHTML = `<div class="empty-note">가져올 카드 결제를 찾지 못했어요${pairCount ? ` (취소된 결제 ${pairCount}건 제외됨)` : ''}</div>`;
      return;
    }
    items.forEach(it => {
      it.dup = it.kind === 'cancel' ? null : sameAsSaved(it);
      it.on = !it.dup && it.kind === 'normal';
      it.answer = (it.kind === 'unknown' && it.dup) ? 'skip' : null;   // 이미 기록된 건은 묻지 않음
    });

    const opt = (arr, v) => arr.map(x => `<option${x===v?' selected':''}>${x}</option>`).join('');
    function draw(){
      const askCount = items.filter(it => (it.kind === 'cancel' || it.kind === 'unknown') && !it.answer).length;
      const onCount = items.filter(it => it.on).length;
      box.innerHTML = `
        <div class="imp-summary" style="margin-top:14px;">
          ${items.length}건 찾음${pairCount ? ` · 취소된 결제 ${pairCount}건 제외` : ''}${askCount ? ` · <b style="color:var(--stamp-gold)">확인 필요 ${askCount}건</b>` : ''}<br>
          ${fromPhoto ? '취소(줄 그어진) 건은 이미 취소된 결제라 빼고, 노란 표시만 확인해주세요.' : '날짜는 캡처 순서로 추정한 값이라 꼭 확인해주세요.'}
        </div>
        ${items.map((it, k) => {
          const isAsk = it.kind === 'cancel' || it.kind === 'unknown';
          let q = '';
          if(it.kind === 'cancel'){
            const saved = loadExpenses(it.date.slice(0,7)).find(e => e.amt === it.amt && (e.memo||'') === it.memo);
            q = `<div class="imp-note">취소 건인데 같은 결제가 이 캡처에 없어요. 어떻게 할까요?</div>
              <div class="imp-q">
                ${saved ? `<button class="chip${it.answer==='delSaved'?' selected':''}" data-k="${k}" data-a="delSaved">기존 기록(${saved.date.slice(5).replace('-','.')}) 삭제</button>` : ''}
                <button class="chip${it.answer==='refund'?' selected':''}" data-k="${k}" data-a="refund">환불로 기록</button>
                <button class="chip${it.answer==='skip'?' selected':''}" data-k="${k}" data-a="skip">무시</button>
              </div>`;
          } else if(it.kind === 'unknown'){
            q = `<div class="imp-note">가맹점이 안 보여요. 지출이 맞나요?</div>
              <div class="imp-q">
                <button class="chip${it.answer==='keep'?' selected':''}" data-k="${k}" data-a="keep">지출 맞음</button>
                <button class="chip${it.answer==='skip'?' selected':''}" data-k="${k}" data-a="skip">빼기</button>
              </div>`;
          }
          const checkable = !isAsk;
          return `
          <div class="imp-row${(!it.on && !(isAsk && it.answer && it.answer!=='skip')) ? ' off' : ''}${isAsk ? ' ask' : ''}">
            <div class="imp-top">
              ${checkable ? `<input type="checkbox" data-chk="${k}"${it.on?' checked':''}>` : ''}
              <span class="m">${it.kind==='cancel' ? '[취소] ' : ''}${esc(it.memo) || '(가맹점 없음)'}</span>
              <span class="a">${it.kind==='cancel' ? '+' : '-'}${it.amt.toLocaleString('ko-KR')}</span>
            </div>
            ${it.dup ? (it.dup.exact
              ? '<div class="imp-note">이미 같은 날짜·금액·가맹점으로 기록돼 있어요 (기본 제외)</div>'
              : `<div class="imp-note">이미 기록된 것 같아요: ${it.dup.e.date.slice(5).replace('-','.')} ${esc(it.dup.e.memo || it.dup.e.cat)} 같은 금액 (기본 제외, 다른 건이면 체크)</div>`) : ''}
            ${it.kind !== 'cancel' ? `
            <div class="imp-grid">
              <input type="date" data-f="date" data-k="${k}" value="${it.date}">
              <select data-f="cat" data-k="${k}">${opt(loadConfig().cats.includes(it.cat) ? loadConfig().cats : [...loadConfig().cats, it.cat], it.cat)}</select>
              <select data-f="pay" data-k="${k}">${opt(PAYS, it.pay)}</select>
            </div>
            ${it.kind==='unknown' ? `<div class="imp-grid" style="grid-template-columns:1fr;"><input type="text" data-f="memo" data-k="${k}" placeholder="가맹점/메모" value="${esc(it.memo)}"></div>` : ''}
            ${(it.amtCheck || it.kind==='unknown') ? `<div class="imp-grid" style="grid-template-columns:1fr;"><input type="number" inputmode="numeric" data-f="amt" data-k="${k}" value="${it.amt}"></div>` : ''}
            ${it.amtCheck ? '<div class="imp-note">금액이 흐리게 읽혔어요. 숫자가 맞는지 확인해주세요.</div>' : ''}
            ${it.dateGuess ? '<div class="imp-note">화면 위쪽이 잘려 날짜를 추정했어요. 확인해주세요.</div>' : ''}
            ${it.payUnknown ? '<div class="imp-note">카드를 알아보지 못해 현금으로 넣었어요. 확인해주세요.</div>' : ''}
            ` : ''}
            ${q}
          </div>`;
        }).join('')}
        <button class="btn btn-primary" id="pSave" style="margin-top:6px;${askCount ? 'opacity:.4;' : ''}"${askCount ? ' disabled' : ''}>${askCount ? '확인 필요한 항목을 먼저 골라주세요' : '선택한 항목 저장'}</button>`;

      box.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { items[+c.dataset.chk].on = c.checked; draw(); });
      box.querySelectorAll('[data-f]').forEach(el => el.onchange = el.oninput = () => {
        items[+el.dataset.k][el.dataset.f] = el.dataset.f === 'amt' ? (parseInt(el.value) || 0) : el.value;
      });
      box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        const it = items[+b.dataset.k];
        it.answer = b.dataset.a;
        it.on = (it.answer === 'keep' || it.answer === 'refund');
        draw();
      });
      const save = $('pSave');
      if(save && !askCount) save.onclick = () => {
        let base = Date.now();
        let saved = 0;
        items.forEach(it => {
          if(it.kind === 'cancel' && it.answer === 'delSaved'){
            const mk = it.date.slice(0,7);
            const list = loadExpenses(mk);
            const idx = list.findIndex(e => e.amt === it.amt && (e.memo||'') === it.memo);
            if(idx > -1){ list.splice(idx,1); saveExpenses(list, mk); saved++; }
            return;
          }
          if(!it.on) return;
          if(!(Number(it.amt) > 0)) return;
          const mk = it.date.slice(0,7);
          const list = loadExpenses(mk);
          list.push({
            id: base++, date: it.date,
            amt: it.kind === 'cancel' ? -it.amt : it.amt,
            cat: it.cat, pay: it.pay,
            memo: it.kind === 'cancel' ? (it.memo + ' 환불') : it.memo.trim()
          });
          saveExpenses(list, mk);
          saved++;
        });
        backdrop.remove();
        renderMain(); renderLedger();
      };
    }
    draw();
  }
  $('pasteBtn').onclick = openPasteSheet;

  /* ---------- init ---------- */
  repairExpenseMonthBuckets();
  renderMain();
  goToPage(0);
})();
</script>
</body>
</html>
